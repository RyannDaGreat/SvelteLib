# PowerRP desktop app — tag-triggered release build.
#
# Cut a release:   git tag v0.2.0 && git push --tags
# The built dmg lands on the GitHub Release for that tag, twice: once with its
# versioned name and once as the STABLE name `PowerRP.dmg`, so
# /releases/latest/download/PowerRP.dmg is a permanent "newest app" URL (the
# README links it; the Homebrew cask uses the versioned one + sha256).
#
# The shipped bundle is SELF-CONTAINED: the repo (minus dev-machine projects)
# plus node and uv are vendored into Resources (desktop/fetch_runtimes.sh +
# electron-builder.yml); first launch installs web deps into Application
# Support. Ad-hoc signed (valid seal — no malware dialog); users still
# right-click → Open once.
# TODO(signing): with an Apple Developer ID, export CSC_LINK/CSC_KEY_PASSWORD
# from repo secrets and add notarization — then the dialog disappears entirely.
name: release-app

on:
  push:
    tags: ["v*"]

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write # create the release + upload the dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shell deps
        working-directory: src/demo_apps/PowerRP/desktop
        run: npm ci --no-fund --no-audit

      - name: Package the app (vendored repo + runtimes, ad-hoc signed dmg)
        working-directory: src/demo_apps/PowerRP/desktop
        run: npm run package:dmg

      - name: FIRST-RUN SMOKE TEST — a release that cannot boot never ships
        working-directory: src/demo_apps/PowerRP/desktop
        run: bash smoke_test.sh

      - name: Stable-name copy for /releases/latest/download/PowerRP.dmg
        working-directory: src/demo_apps/PowerRP/desktop
        run: cp dist/PowerRP-*.dmg dist/PowerRP.dmg

      - name: Publish dmg to the tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/demo_apps/PowerRP/desktop/dist/PowerRP-*.dmg
            src/demo_apps/PowerRP/desktop/dist/PowerRP.dmg
          body: |
            PowerRP desktop app (self-contained: repo + node + uv vendored;
            first launch downloads web deps). Unsigned/ad-hoc build — first
            open: right-click → Open.
