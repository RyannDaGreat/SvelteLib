<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerRP WebGPU benchmark</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --hud-bg: rgba(20, 20, 35, 0.85);
      --hud-text: #e6e6f0;
      --hud-accent: #7aa2f7;
      --hud-pad: 10px 14px;
      --hud-radius: 10px;
      --hud-font: 13px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: fixed; top: 12px; right: 12px;
      background: var(--hud-bg); color: var(--hud-text);
      padding: var(--hud-pad); border-radius: var(--hud-radius);
      font-size: var(--hud-font); line-height: 1.6; white-space: pre;
    }
    #hud b { color: var(--hud-accent); }
    #hud a { color: var(--hud-accent); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">booting…</div>
  <script type="module" src="./bench.js"></script>
</body>
</html>
