<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — REQUIRED for `env(safe-area-inset-*)` to be anything
      but 0. Without it those values are zero on every device, so the phone
      Present dock (web/PresentDock.svelte, `.present-dock` in app.css) would sit
      UNDER the home indicator on a notched iPhone with no way to express the
      clearance. This is the enabling half of a pair: the padding that USES the
      insets lives in app.css's phone block, and the two belong together — cover
      alone lets content extend into the unsafe strip, which is only correct once
      something is reading the insets back out.

      NOT ADDED, deliberately: `interactive-widget=resizes-content`. It is the
      right lever for the software keyboard resizing the LAYOUT viewport instead
      of only the visual one, and it is what Chrome honours — but this session
      could not verify iOS Safari support, and iOS is the stated target. Shipping
      an unverified key into the file that boots the app, with a comment claiming
      it fixes the reported bounce, would be a confident wrong answer. The
      remedy that IS well-established on iOS is `window.visualViewport`; see the
      W5-MOBILE report for the measured-vs-reasoned split on that bug.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <!--
      INSTALLABILITY. The manifest and icon are emitted at the bundle root by
      web/swBuildPlugin.js, so these are RELATIVE hrefs — vite rewrites them with
      the build's base path, which is "/SvelteLib/" on Pages. An absolute "/…"
      would resolve to the domain root there and 404.

      They are harmless on the dev server (two 404s in the network tab, no
      behaviour change) and REQUIRED on the static deploy, where installing to
      the home screen is the mitigation for iOS evicting an uninstalled site's
      storage after ~7 days of no visits — an installed PWA is not subject to
      that sweep, which is what makes "your drafts are still here" true on iOS.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Mirrors Nocturne's --bg, the DEFAULT_THEME (web/app.svelte.js). Must be
         re-derived if that default changes, along with the boot splash below. -->
    <meta name="theme-color" content="#0e1117" />
    <title>PowerRP</title>
    <!--
      THE BOOT SPLASH — inline HTML + inline CSS + inline JS, deliberately.

      The reported bug: "loading the site for the first time its a big gray box
      with no loading bar." On a cold cache the app shell is blank for seconds
      while CanvasKit's ~7 MB wasm downloads and boots, and the user gets zero
      feedback. This markup is parsed and painted BEFORE the module bundle is
      even requested, which is the only way to cover t=0 — an import cannot
      paint before it loads, so the splash cannot live in a component.

      It cannot read app.css's --a-* tokens (that stylesheet arrives with the
      bundle), so the few colours it needs are inlined and mirror the DEFAULT
      THEME's dark member — Nocturne (--bg #0e1117 / --fg #e4e8f0 / --fg-dim
      #98a3b8) — and its light twin Daybreak (--bg #dce3ec / --fg #1a2230 /
      --fg-dim #55617a) via prefers-color-scheme.

      THESE FOUR NUMBERS ARE A HAND-COPY OF app.css AND THERE IS NO GATE ON THEM.
      That is not laziness: the splash must paint before any stylesheet loads, so
      it structurally cannot read the token it mirrors. The cost is that changing
      DEFAULT_THEME (web/app.svelte.js) silently leaves this backdrop showing the
      OLD theme for the length of a cold boot — which is precisely the flash the
      next paragraph forbids. They were Graphite's until 2026-08-01, when the user
      made Nocturne the default. If you move the default again, move these too,
      and the theme-color meta above with them.

      WARM LOADS MUST NOT FLASH. The backdrop covers the gray box from the first
      paint, but the progress UI (title, bar, stage list) stays at opacity 0
      until REVEAL_DELAY_MS. A subsecond warm boot therefore shows a plain
      themed backdrop that lifts silently — no spinner blink, no jank.

      Removal is at the FIRST REAL CANVAS PAINT (CanvasView calls bootDone()
      after gpu.render), never on a timer. Boot failure calls fail() and the
      splash turns into a loud error surface, because a gray box forever is the
      current failure mode too.

      ── THE STAGE LIST (WORKSTREAM AH) ─────────────────────────────────────────
      The user's complaint, verbatim: "Often when the app starts, it says
      'starting' and it just says 'starting' for a very, very long time… Someone
      who's opening this for the first time will have no confidence that it's not
      looping forever… don't bullshit them… make sure that it's actually
      reporting real progress."

      So the splash shows the WHOLE ROSTER of boot stages at once, not one line
      that changes. A roster answers "how much is left" — the question a single
      line structurally cannot answer — and the user's confidence comes from
      watching rows TICK OFF, i.e. from motion through a list of known length.

      THE HONESTY RULES, which the display enforces rather than merely intends:
        · A row shows a PERCENTAGE only when a real denominator exists (the wasm's
          Content-Length, the font roster's face count). There is no synthetic
          progress anywhere — see bootProgress.js, which refuses to invent one.
        · A row with no measurable progress (wasm COMPILE emits no events; the
          bundle parse is one opaque block of main-thread work) shows its NAME and
          a LIVE ELAPSED CLOCK: "Compiling renderer… 1.4s". That is a true
          statement about a stage that is genuinely running and genuinely
          unmeasurable, and it still moves, which is the property that
          distinguishes it from a hang.
        · A row that has not started yet is dimmed and silent. It is a promise
          about what comes next, which is the other half of "not looping forever".

      THE ROSTER IS DECLARED HERE, ahead of time, because the point is to show the
      user stages they have NOT reached yet. STAGES below is that declaration; a
      bootStage() id that is not in it is appended live (so a new stage can never
      be silently dropped), but the ordered spine is this list.

      ── THE CRASH SURFACE (WORKSTREAM AI) ──────────────────────────────────────
      The user, verbatim: "oh no um, yeah, so it turned out it actually crashed
      when it was loading and I couldn't tell because it off- I'm so used to it
      taking such a long time to say starting that I didn't even think to look in
      the console for this error."

      That is the failure the roster ALONE cannot catch. AH's fail() surfaces a
      death a stage REPORTS; the incident's crash reported nothing — a module in
      the import graph threw `properties.bundle: unknown bundle "transform"` at
      evaluation time, so no stage ever called fail(), the roster froze mid-list,
      and a DEAD boot was indistinguishable from AH's own honestly-slow one. The
      slower and more honest the splash gets, the more perfectly a crash hides
      inside it. So the splash must trap what nothing else will.

      window.onerror + unhandledrejection are installed BELOW, in this same first
      inline script, and the position is load-bearing: an import-graph throw fires
      during the module bundle's evaluation, which is BEFORE any code the bundle
      itself could install a handler from. A handler that arrives with the app
      cannot catch the app failing to arrive.

      They hand straight to fail(), so a crash renders in AH's existing failure
      surface — same roster, same ✕ on the row that was running. A crash that
      belongs to no stage is still ATTRIBUTED to one: the row left "active" is
      where boot got to, which is a true statement about the crash even when the
      crash is not that stage's own fault. What the crash adds beyond a stage
      failure is the TOP STACK FRAME (one line — the file:line that threw, not a
      wall of frames) and the REMEDY, because the incident's actual fix was
      "unregister the service worker, clear site data, reload" and a user staring
      at a message with no next step is barely better off than one staring at a
      spinner.

      THE HANDLERS STAND DOWN at done() — the first painted frame. After that the
      editor owns its own error surfaces (the error box, the expression seam), and
      a splash that has already lifted must not resurrect itself over a working
      editor to report a transient runtime rejection. `finished` is what gates
      them, so this is one flag, not a second lifecycle.
    -->
    <style>
      :root {
        --boot-bg: #0e1117;
        --boot-fg: #e4e8f0;
        --boot-dim: #98a3b8;
        --boot-track: rgba(255, 255, 255, 0.1);
        --boot-bar: #e4e8f0;
        --boot-error: #ff6b6b;
        --boot-reveal-ms: 400ms; /* progress UI fade-in; must match REVEAL_DELAY_MS */
        --boot-lift-ms: 220ms;   /* splash fade-out once the first frame exists */
        --boot-gap: 14px;
        --boot-bar-h: 3px;
        --boot-bar-w: 320px;
        --boot-title-size: 15px;
        --boot-stage-size: 12px;
        --boot-error-pad: 16px;
        --boot-error-max-w: 640px;
        /* The stage roster */
        --boot-row-gap: 7px;          /* between stage rows */
        --boot-row-pad: 2px;          /* row vertical breathing room */
        --boot-mark-w: 14px;          /* the ✓/· gutter, fixed so labels align */
        --boot-detail-dim: 0.75;      /* the trailing "2.1 MB / 6.9 MB" against the label */
        --boot-pending-dim: 0.38;     /* a stage the boot has not reached yet */
        --boot-done-dim: 0.55;        /* a finished stage: present, but no longer the subject */
        --boot-row-fade-ms: 200ms;
        --boot-tick-size: 11px;
        /* The crash surface's remedy block: quieter than the error itself, so
           the eye reads WHAT BROKE first and WHAT TO DO second. */
        --boot-guidance-dim: 0.8;
        --boot-guidance-gap: 10px;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --boot-bg: #dce3ec;
          --boot-fg: #1a2230;
          --boot-dim: #55617a;
          --boot-track: rgba(0, 0, 0, 0.14);
          --boot-bar: #1a2230;
          --boot-error: #c02626;
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--boot-gap);
        background: var(--boot-bg);
        color: var(--boot-fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity var(--boot-lift-ms) ease;
      }
      /* The gray box is covered from t=0, but nothing READS as loading until the
         boot has proven itself slow — that is what keeps warm loads silent. */
      #boot-splash > .boot-ui {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--boot-gap);
        opacity: 0;
        transition: opacity var(--boot-reveal-ms) ease;
      }
      #boot-splash[data-revealed="1"] > .boot-ui { opacity: 1; }
      #boot-splash[data-lifting="1"] { opacity: 0; pointer-events: none; }
      .boot-title {
        font-size: var(--boot-title-size);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .boot-track {
        width: var(--boot-bar-w);
        height: var(--boot-bar-h);
        background: var(--boot-track);
        overflow: hidden;
      }
      .boot-bar {
        height: 100%;
        width: 0%;
        background: var(--boot-bar);
        transition: width 120ms linear;
      }
      /* Indeterminate: a real download with no Content-Length. The bar sweeps to
         say "alive" WITHOUT claiming a percentage it does not know. */
      .boot-track[data-indeterminate="1"] > .boot-bar {
        width: 35%;
        transition: none;
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(286%); }
      }
      /* THE STAGE ROSTER. One row per named boot stage, in declared order, all
         visible at once — the list's LENGTH is the "how much is left" signal a
         single changing line cannot give. */
      .boot-stages {
        display: flex;
        flex-direction: column;
        gap: var(--boot-row-gap);
        width: var(--boot-bar-w);
        font-size: var(--boot-stage-size);
        font-variant-numeric: tabular-nums;
      }
      .boot-row {
        display: flex;
        align-items: baseline;
        gap: var(--boot-mark-w);
        padding: var(--boot-row-pad) 0;
        color: var(--boot-dim);
        transition: opacity var(--boot-row-fade-ms) ease, color var(--boot-row-fade-ms) ease;
      }
      /* The ✓/· gutter is a FIXED width so every label starts at the same x —
         rows that jitter horizontally as marks change read as instability. */
      .boot-mark {
        flex: 0 0 var(--boot-mark-w);
        margin-right: calc(-1 * var(--boot-mark-w));
        font-size: var(--boot-tick-size);
        text-align: center;
      }
      .boot-row-label { flex: 1 1 auto; }
      .boot-row-detail { opacity: var(--boot-detail-dim); white-space: nowrap; }
      /* Not started: dimmed and silent — a promise about what comes next. */
      .boot-row[data-state="pending"] { opacity: var(--boot-pending-dim); }
      /* Running: full-strength foreground. Exactly one row is the subject. */
      .boot-row[data-state="active"] { color: var(--boot-fg); opacity: 1; }
      /* Finished: ticked off and stepped back, so the eye tracks the frontier. */
      .boot-row[data-state="done"] { opacity: var(--boot-done-dim); }
      .boot-error {
        display: none;
        max-width: var(--boot-error-max-w);
        padding: var(--boot-error-pad);
        color: var(--boot-error);
        font-size: var(--boot-stage-size);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        text-align: left;
        line-height: 1.5;
      }
      /* On failure the BAR goes (it has nothing true left to say) but the ROSTER
         STAYS: the row marked ✕ is which of the stages died, and the rows above it
         are the ones that did succeed — that is the difference between "it broke"
         and "it broke HERE, after getting this far". */
      #boot-splash[data-failed="1"] .boot-track { display: none; }
      #boot-splash[data-failed="1"] .boot-error { display: block; }
      #boot-splash[data-failed="1"] > .boot-ui { opacity: 1; }
      /* THE REMEDY. In the app's own foreground, not the error red: it is not
         part of the failure, it is the way out of it. A user who has just been
         told the app is dead needs the next step to read as instruction rather
         than as more alarm. */
      .boot-guidance {
        display: none;
        max-width: var(--boot-error-max-w);
        padding: 0 var(--boot-error-pad);
        margin-top: calc(-1 * var(--boot-guidance-gap));
        color: var(--boot-fg);
        opacity: var(--boot-guidance-dim);
        font-size: var(--boot-stage-size);
        text-align: left;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      #boot-splash[data-failed="1"] .boot-guidance { display: block; }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash > .boot-ui, .boot-bar { transition: none; }
        .boot-track[data-indeterminate="1"] > .boot-bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash">
      <div class="boot-ui">
        <div class="boot-title">PowerRP</div>
        <div class="boot-track" id="boot-track"><div class="boot-bar" id="boot-bar"></div></div>
        <div class="boot-stages" id="boot-stages"></div>
        <div class="boot-error" id="boot-error"></div>
        <div class="boot-guidance" id="boot-guidance"></div>
      </div>
    </div>
    <script>
      // window.__powerrp_boot — THE seam web/bootProgress.js talks to. It must be
      // a plain inline script, not a module: this has to exist before the bundle
      // so the very first loader call has somewhere to report to.
      (function () {
        var REVEAL_DELAY_MS = 400;  // below this, a warm boot shows no progress UI at all
        var LIFT_MS = 220;          // must match --boot-lift-ms
        var ELAPSED_TICK_MS = 100;  // how often an unmeasurable stage's clock reprints
        var ELAPSED_FLOOR_MS = 400; // below this, a stage's elapsed clock is noise, so it stays silent
        var el = document.getElementById("boot-splash");
        var bar = document.getElementById("boot-bar");
        var track = document.getElementById("boot-track");
        var stagesEl = document.getElementById("boot-stages");
        var errorEl = document.getElementById("boot-error");
        var guidanceEl = document.getElementById("boot-guidance");
        var finished = false;
        // Stage history, in arrival order — the probe asserts it advances
        // monotonically, and it is the honest record of what boot actually did.
        var history = [];

        // ── THE DECLARED ROSTER ────────────────────────────────────────────────
        // Ordered, and declared BEFORE boot runs, because the whole point is to
        // show the user the stages they have not reached yet. Each entry's `id`
        // must match the id its bootStage() caller passes; `label` is the user's
        // sentence for it. Measured cold-boot cost is noted so the next person
        // editing this list knows which rows actually matter.
        //   · Every one of these is REAL WORK the boot genuinely does. There is no
        //     decorative row, and none of them is a timer pretending to be work.
        var STAGES = [
          { id: "bundle",     label: "Loading app code" },      // ~13s Fast-3G / ~0.5s local — the parse+eval wall
          { id: "wasm",       label: "Downloading renderer" },  // ~7 MB, THE cold-boot cost; metered in bytes
          { id: "fonts",      label: "Loading fonts" },         // 30 CSS faces, counted; runs WITH the wasm
          { id: "storage",    label: "Checking storage" },      // one GET
          { id: "wasm-init",  label: "Compiling renderer" },    // no progress events exist — elapsed only
          { id: "skia-fonts", label: "Preparing text" },        // 50 Skia faces, counted
          { id: "mount",      label: "Building the editor" },
          { id: "frame",      label: "Drawing first frame" },
        ];

        // The ONE stage the top bar reports (see the `known` branch in stage()):
        // the 7 MB wasm, the stage that dominates a cold boot and the only big one
        // with a true Content-Length denominator.
        var BAR_STAGE = "wasm";

        var rows = {};   // id → {root, mark, name, detail, state, startedAt, measurable}
        var order = [];  // ids in display order (STAGES, then any live arrival)

        var revealTimer = setTimeout(function () {
          if (!finished) el.setAttribute("data-revealed", "1");
        }, REVEAL_DELAY_MS);

        /** Pure function. Bytes → a short human string ("6.9 MB"). */
        function mb(bytes) {
          return (bytes / 1048576).toFixed(1) + " MB";
        }

        /** Pure function. Milliseconds → a short elapsed string ("1.4s"). */
        function secs(ms) {
          return (ms / 1000).toFixed(1) + "s";
        }

        /** Command. Creates (once) and returns the DOM row for a stage id. A row
         *  arriving that STAGES never declared is APPENDED rather than dropped —
         *  a new bootStage() caller must never be silently invisible. */
        function rowFor(id, label) {
          if (rows[id]) return rows[id];
          var root = document.createElement("div");
          root.className = "boot-row";
          root.setAttribute("data-stage", id);
          root.setAttribute("data-state", "pending");
          var mark = document.createElement("span");
          mark.className = "boot-mark";
          mark.textContent = "·";
          var name = document.createElement("span");
          name.className = "boot-row-label";
          name.textContent = label;
          var detail = document.createElement("span");
          detail.className = "boot-row-detail";
          root.appendChild(mark);
          root.appendChild(name);
          root.appendChild(detail);
          stagesEl.appendChild(root);
          order.push(id);
          rows[id] = { root: root, mark: mark, name: name, detail: detail, state: "pending", startedAt: 0, measurable: false };
          return rows[id];
        }

        // Build the declared roster up front, all rows pending.
        for (var i = 0; i < STAGES.length; i++) rowFor(STAGES[i].id, STAGES[i].label);

        /** Command. Repaints the elapsed clock on every row that is RUNNING and
         *  has no measurable progress. This is the honest answer to "compile has
         *  no progress events": a name plus a clock that is visibly moving. A row
         *  that HAS real numbers is left alone — its numbers are better than a
         *  clock, and printing both would be noise. */
        function tickElapsed() {
          var now = Date.now();
          for (var k = 0; k < order.length; k++) {
            var r = rows[order[k]];
            if (r.state !== "active" || r.measurable) continue;
            var dt = now - r.startedAt;
            // Below the floor an elapsed readout is just flicker; the row still
            // reads as active from its highlight, which is the honest signal.
            r.detail.textContent = dt >= ELAPSED_FLOOR_MS ? secs(dt) : "";
          }
        }
        var elapsedTimer = setInterval(tickElapsed, ELAPSED_TICK_MS);

        /** Command. Marks earlier rows done when a LATER row starts reporting.
         *
         *  Boot is MOSTLY a sequence, so reaching stage N is usually proof that
         *  stages < N finished — and without that inference a stage whose
         *  completion nothing reports (the bundle parse has no "I am done" event
         *  to fire) would sit "active" forever underneath a later running row,
         *  which is a false statement on screen.
         *
         *  BUT IT IS NOT A TOTAL ORDER ANY MORE, and assuming it was would put a
         *  ✓ on work still in flight — the exact species of lie this feature
         *  exists to remove. Since the wasm prefetch moved to module load it runs
         *  CONCURRENTLY with the font load, so `fonts` reporting proves nothing
         *  whatsoever about `wasm`. CONCURRENT names the rows that overlap; a row
         *  listed there is never settled by inference and must report its own
         *  `done`, which both of these do (fetchWithProgress ends with done:true,
         *  and the face counter ends at loaded === total). */
        var CONCURRENT = { wasm: 1, fonts: 1, storage: 1 };
        function settlePriorTo(id) {
          for (var k = 0; k < order.length; k++) {
            if (order[k] === id) break;
            var r = rows[order[k]];
            if (r.state === "active" && !CONCURRENT[order[k]]) setState(r, "done");
          }
        }

        /** Command. Moves one row between pending → active → done. */
        function setState(r, state) {
          if (r.state === state) return;
          r.state = state;
          r.root.setAttribute("data-state", state);
          if (state === "active") {
            r.startedAt = Date.now();
            r.mark.textContent = "›";
          } else if (state === "done") {
            r.mark.textContent = "✓";
            // A finished row keeps its FINAL numbers when it had real ones (the
            // wasm's total, the face count) and drops its elapsed clock when it
            // did not — a frozen clock on a finished row reads as a stall.
            if (!r.measurable) r.detail.textContent = "";
          }
        }

        window.__powerrp_boot = {
          history: history,
          stage: function (id, label, detail) {
            if (finished) return;
            detail = detail || {};
            history.push({ id: id, label: label, loaded: detail.loaded, total: detail.total, unit: detail.unit || "bytes", done: !!detail.done, t: Date.now() });
            var r = rowFor(id, label);
            settlePriorTo(id);
            if (r.state === "pending") setState(r, "active");
            // `unit` keeps the readout HONEST about what it is counting: the wasm
            // stage counts bytes ("2.1 MB / 6.9 MB"), the font stage counts FACES
            // ("7 / 50"), because those download in parallel and a byte total
            // would be a sum of concurrent unknowns.
            var count = detail.unit === "count";
            var fmt = count ? function (n) { return String(n); } : mb;
            var known = typeof detail.total === "number" && detail.total > 0 && typeof detail.loaded === "number";
            if (known) {
              r.measurable = true;
              // THE TOP BAR TRACKS ONE STAGE, and it is the wasm. With the fonts
              // now downloading CONCURRENTLY with it, a bar driven by whichever
              // stage reported last would jump backwards between two unrelated
              // percentages — motion that means nothing. The wasm is the right
              // single subject: it is 7 MB against the fonts' 3.4 MB, it is the
              // stage that dominates a cold boot, and it is honestly metered by
              // Content-Length. Every other stage still shows its own real
              // numbers on its own row; they just do not fight over the bar.
              if (id === BAR_STAGE) {
                track.removeAttribute("data-indeterminate");
                var pct = Math.max(0, Math.min(100, (detail.loaded / detail.total) * 100));
                bar.style.width = pct.toFixed(1) + "%";
              }
              r.detail.textContent = fmt(detail.loaded) + " / " + fmt(detail.total);
            } else if (typeof detail.loaded === "number" && detail.loaded > 0) {
              // Real progress, unknown total (gzip / no Content-Length): show the
              // count that IS known and sweep. Never a synthetic percentage.
              r.measurable = true;
              if (id === BAR_STAGE) track.setAttribute("data-indeterminate", "1");
              r.detail.textContent = fmt(detail.loaded);
            } else {
              // NO measurable progress for this stage. The row falls back to its
              // name plus the live elapsed clock (tickElapsed), which is a true
              // statement rather than an invented percentage.
              if (id === BAR_STAGE) track.setAttribute("data-indeterminate", "1");
            }
            if (detail.done) setState(r, "done");
            tickElapsed();
          },
          done: function () {
            if (finished) return;
            finished = true;
            clearTimeout(revealTimer);
            clearInterval(elapsedTimer);
            el.setAttribute("data-lifting", "1");
            setTimeout(function () { el.remove(); }, LIFT_MS);
          },
          fail: function (message, guidance) {
            // A failure OUTRANKS done(): it must be visible even if something
            // else already tried to lift the splash.
            finished = false;
            clearTimeout(revealTimer);
            clearInterval(elapsedTimer);
            el.setAttribute("data-revealed", "1");
            el.setAttribute("data-failed", "1");
            el.removeAttribute("data-lifting");
            // NAME THE STAGE THAT DIED. The roster is still on screen under the
            // error, and the row left in "active" is the one that failed — so the
            // failure surface says which of the seven stages broke instead of
            // making the user infer it from a stack.
            var dying = null;
            for (var k = 0; k < order.length; k++) if (rows[order[k]].state === "active") dying = rows[order[k]];
            if (dying) {
              dying.mark.textContent = "✕";
              dying.root.setAttribute("data-state", "active");
            }
            errorEl.textContent = "PowerRP failed to start" + (dying ? " while " + dying.name.textContent.toLowerCase() + "." : ".") + "\n\n" + message;
            guidanceEl.textContent = guidance || "";
          },
        };

        // ── THE CRASH SURFACE (WORKSTREAM AI) ───────────────────────────────
        // See the docblock in <head>. Everything below exists because a boot can
        // die WITHOUT any stage reporting it, and AH's honest slowness is what
        // makes that death invisible.

        /** THE REMEDY, and it is the one that actually worked. The incident was a
         *  stale service worker serving a MIXED bundle set, and what fixed it was
         *  literally: unregister the worker, clear site data, reload. A reload
         *  alone is tried first because it is free and fixes the transient half;
         *  clearing is named second because it is the heavier step and it is the
         *  one that beats a poisoned cache. Naming the console last is honest —
         *  it is where the full stack is, and the user's own words were that he
         *  "didn't even think to look in the console", so this tells him. */
        var CRASH_GUIDANCE =
          "Try reloading the page.\n" +
          "If it keeps happening, clear this site's data (browser settings → site data → clear) and reload — a half-updated offline cache is the usual cause.\n" +
          "The browser console has the full stack.";

        /** Pure function. The ONE most useful stack line: the frame that threw.
         *  A full stack in a boot splash is a wall the user cannot act on, and it
         *  pushes the guidance off screen; the top frame is the single line that
         *  says WHERE, which is what makes this reportable. Returns "" when the
         *  stack is unusable, in which case the message stands alone.
         *
         *  >>> topFrame("Error: boom\n    at bundle.js:42:7\n    at m.js:1:1")
         *  "at bundle.js:42:7"
         *  >>> topFrame(undefined)
         *  "" */
        function topFrame(stack) {
          if (typeof stack !== "string") return "";
          var lines = stack.split("\n");
          for (var k = 0; k < lines.length; k++) {
            var line = lines[k].trim();
            if (line.indexOf("at ") === 0) return line;
          }
          return "";
        }

        /** Command. Renders an uncaught boot error in the splash. `kind` names
         *  the CATEGORY in the user's words, because "an error" and "a promise
         *  that was never handled" are different enough that saying which one
         *  costs nothing and saves a guess. */
        function reportCrash(kind, message, stack) {
          if (finished) return;
          var frame = topFrame(stack);
          window.__powerrp_boot.fail(kind + ":\n" + message + (frame ? "\n" + frame : ""), CRASH_GUIDANCE);
        }

        // A boot that dies before any of our own code runs (a bundle that 404s
        // under the wrong base path, a syntax error) would otherwise leave the
        // splash spinning forever — which is the same gray box with extra steps.
        //
        // TWO DISTINCT EVENTS SHARE THIS ONE LISTENER because the platform
        // overloads `error`: a RESOURCE failure (capture phase, has ev.target)
        // and an uncaught THROW (has ev.error/ev.message). They need different
        // sentences — one is "the file never arrived", the other is "the code
        // arrived and blew up" — so they are branched, not merged.
        window.addEventListener("error", function (ev) {
          if (finished) return;
          var t = ev.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            window.__powerrp_boot.fail(
              "Failed to load " + (t.src || t.href) + "\n\nThe app bundle could not be fetched. If this is a static deploy, the base path is the usual cause.",
              CRASH_GUIDANCE,
            );
            return;
          }
          // The incident's shape: a module in the import graph threw while being
          // evaluated. `ev.error` carries the stack; `ev.message` is the fallback
          // for a cross-origin script, where the browser gives us only "Script
          // error." — still worth showing, because "it crashed" beats a spinner.
          var err = ev.error;
          reportCrash("Uncaught error", (err && err.message) || ev.message || String(err), err && err.stack);
        }, true);

        // A rejected promise nobody caught. The boot path is almost entirely
        // async (fetch the wasm, load fonts, open storage), so this is not an
        // exotic case — it is the SHAPE most boot failures take, and without this
        // handler every one of them is a silent freeze.
        window.addEventListener("unhandledrejection", function (ev) {
          if (finished) return;
          var r = ev.reason;
          reportCrash("Unhandled promise rejection", (r && r.message) || String(r), r && r.stack);
        });
      })();
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
