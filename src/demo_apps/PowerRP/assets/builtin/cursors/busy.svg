<svg height="32" viewBox="0 0 32 32" width="32" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><linearGradient id="busya" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0" stop-color="#4ab4ef"/><stop offset="1" stop-color="#3582e5"/></linearGradient><linearGradient id="busyb" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0" stop-color="#3481e4"/><stop offset="1" stop-color="#2051db"/></linearGradient><linearGradient id="busyc" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0" stop-color="#6bdcfc"/><stop offset="1" stop-color="#4dc6fa"/></linearGradient><linearGradient id="busyd" x1="50%" x2="50%" y1="0%" y2="100%"><stop offset="0" stop-color="#4bc5f9"/><stop offset="1" stop-color="#2fb0f8"/></linearGradient><!-- The spinner disc is four quarter-disc SECTORS, not squares clipped by a mask: masks are a punted feature of the v1 SVG flatten (core/svg_paths.js drops the mask element and renders the masked element unmasked), so the old artwork drew four bare squares in every renderer. Every built-in cursor must stay inside the supported subset. In this frame the disc is centre (9,9) radius 9; each sector is centre, radius, one quarter arc, close, the arc a KAPPA cubic with control arm 12*(sqrt(2)-1) = 4.970563 (9 minus that = 4.029437, 9 plus that = 13.970563). Every control point stays inside its quadrant, so each sector's bounding box is the same 9x9 the rect had and the objectBoundingBox gradients above map identically. --><g fill="none" fill-rule="evenodd" transform="translate(7)"><g transform="translate(1 14)"><path d="M9 9L0 9C0 4.029437 4.029437 0 9 0Z" fill="url(#busya)"/><path d="M9 9L18 9C18 13.970563 13.970563 18 9 18Z" fill="url(#busyb)"/><path d="M9 9L9 0C13.970563 0 18 4.029437 18 9Z" fill="url(#busyc)"/><path d="M9 9L9 18C4.029437 18 0 13.970563 0 9Z" fill="url(#busyd)"/></g><g fill-rule="nonzero"><path d="m0 16.422v-16.015l11.591 11.619h-7.041l-.151.124z" fill="#fff"/><path d="m1 2.814v11.188l2.969-2.866.16-.139h5.036z" fill="#000"/></g></g></svg>