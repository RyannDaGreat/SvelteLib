# PowerRP desktop shell — electron-builder config (v1: unsigned, this-machine).
# asar is OFF because the shell's whole job is spawning real on-disk processes
# (bash → python via uv → node/vite); nothing here benefits from an archive.
appId: org.ryancentral.powerrp
productName: PowerRP
directories:
  output: dist
files:
  - main.js
  - package.json
extraResources:
  # v1 seam: the dump's absolute path, baked by write_repo_path.js. The v2 CI
  # build replaces this with the repo itself vendored under Resources/.
  - from: dist-resources/repo-path.txt
    to: repo-path.txt
asar: false
mac:
  target:
    - dir
    - dmg
  # NO identity key: electron-builder then applies its own AD-HOC signature,
  # which keeps the bundle seal VALID. `identity: null` (tried first) skips
  # signing entirely after the bundle is modified — a BROKEN seal, which
  # macOS greets with the "will damage your computer" malware dialog, not the
  # ordinary "unverified developer" one. Real Developer ID + notarization for
  # shipping to strangers lands via CI secrets — see release-app.yml.
