<!-- The NESTED asset for relative_ref_cli_test.js. Deliberately tiny: what the
     suite asserts is that a relative ref resolved to a file on disk, not what the
     file draws. It is committed HERE (tests/fixtures/, which is source) and copied
     into a throwaway project by the suite, because projects/ is gitignored user
     data and a gate may not read from one. A stroked shape, not a bare fill, so a
     backend that dropped the stroke would still be visible in the PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <ellipse cx="12" cy="5" rx="8" ry="3" fill="#3b7dd8" stroke="#12305c" stroke-width="1.5"/>
  <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" fill="none" stroke="#12305c" stroke-width="1.5"/>
  <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" fill="none" stroke="#12305c" stroke-width="1.5"/>
</svg>
